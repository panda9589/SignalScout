spring:
  application:
    name: signalscout
    version: 1.0.0
  
  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signalscout}
    username: ${SPRING_DATASOURCE_USERNAME:scout}
    password: ${SPRING_DATASOURCE_PASSWORD:scout_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Redis Configuration (optional)
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
    
  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-timezone: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-stacktrace: on_param

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY:}
    endpoint: https://api.openai.com/v1/chat/completions

sec:
  api:
    user-agent: ${SEC_USER_AGENT:SignalScout local-dev contact@example.com}

ingestion:
  scheduler:
    enabled: ${INGESTION_SCHEDULER_ENABLED:false}
  sec:
    limit-per-company: ${INGESTION_SEC_LIMIT_PER_COMPANY:3}
    initial-delay-ms: ${INGESTION_SEC_INITIAL_DELAY_MS:60000}
    fixed-delay-ms: ${INGESTION_SEC_FIXED_DELAY_MS:3600000}
  rss:
    feeds: ${INGESTION_RSS_FEEDS:}
    limit-per-feed: ${INGESTION_RSS_LIMIT_PER_FEED:5}
    initial-delay-ms: ${INGESTION_RSS_INITIAL_DELAY_MS:90000}
    fixed-delay-ms: ${INGESTION_RSS_FIXED_DELAY_MS:3600000}

reports:
  email:
    to: ${REPORT_EMAIL_TO:}
    from: ${REPORT_EMAIL_FROM:}
  scheduler:
    enabled: ${REPORT_SCHEDULER_ENABLED:false}
    daily-cron: ${REPORT_DAILY_CRON:0 0 18 * * MON-FRI}
    weekly-cron: ${REPORT_WEEKLY_CRON:0 0 18 * * SUN}

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.scout: ${LOGGING_LEVEL_COM_SCOUT:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
