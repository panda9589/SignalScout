version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16-latest
    container_name: signalscout-postgres
    environment:
      POSTGRES_DB: signalscout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d signalscout"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signalscout-network

  redis:
    image: redis:7-alpine
    container_name: signalscout-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signalscout-network

volumes:
  postgres_data:
  redis_data:

networks:
  signalscout-network:
    driver: bridge
